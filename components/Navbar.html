<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex, nofollow">
	<title>Parth Jethva | Navigation</title>
	<!-- Use Tailwind Play CDN so arbitrary values (e.g., to-[#191919]) work without a build step -->
	<script src="https://cdn.tailwindcss.com"></script>
	   <script src="https://cdn.tailwindcss.com?v=3"></script>
	<!-- Google Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="../assets/css/main.css" />
	<script>
		tailwind.config = {
			theme: {
				extend: {
					colors: {
						brand: '#191919',
					},
					fontFamily: {
						sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
						serif: ['Playfair Display', 'Georgia', 'serif'],
					}
				},
			},
		};
	</script>
	<style>
		/* Additional overrides for the mobile menu transition */
		.mobile-menu {
			transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
		}
		body {
			font-family: 'Inter', system-ui, -apple-system, sans-serif;
		}
		h1, h2, h3, h4, h5, h6 {
			font-family: 'Playfair Display', Georgia, serif;
		}
		
		/* Navbar header responsive background */
		@media (max-width: 768px) {
			#site-header {
				background: linear-gradient(180deg, rgba(0, 0, 0, 0.85), rgba(25, 25, 25, 0.8)) !important;
				backdrop-filter: blur(12px);
			}
		}
		
		/* Mobile menu darker background for better readability */
		#mobile-menu {
			background: linear-gradient(180deg, rgba(0, 0, 0, 0.95), rgba(25, 25, 25, 0.92)) !important;
			backdrop-filter: blur(15px);
		}
		
		/* Hamburger Menu Button - Visible on Mobile */
		#menu-toggle {
			display: flex !important;
			padding: 8px;
			cursor: pointer;
			z-index: 50 !important;
		}
		
		#menu-toggle:hover {
			opacity: 0.8;
		}
		
		#menu-toggle span {
			display: block;
			width: 24px;
			height: 2px;
			background-color: #ffffff;
			margin: 5px 0;
			transition: all 0.3s ease-in-out;
			border-radius: 2px;
		}
		
		/* Active nav link styling */
		.nav-link.active {
			color: #FFBE49 !important;
			font-weight: 700;
			text-decoration: underline;
			text-decoration-thickness: 2px;
			text-underline-offset: 6px;
		}
		
		.nav-link.active::after {
			content: '';
			position: absolute;
			bottom: -8px;
			left: 0;
			right: 0;
			height: 2px;
			background: #FFBE49;
		}
	</style>
</head>
<body class="antialiased bg-black text-white">
	<header
		id="site-header"
		class="fixed top-0 inset-x-0 z-50 bg-gradient-to-r from-white/5 to-[#191919] backdrop-blur-md shadow-sm transition-shadow duration-300"
	>
		<div class="max-w-7xl mx-auto h-20 px-6 md:px-12 lg:px-20 flex items-center justify-between">
			<a href="/" class="flex items-center gap-3 group" aria-label="Parth Jethva home">
				<img
					src="../img/design/Logo.svg"
					alt="Parth Jethva Logo"
					class="h-16 w-20 object-contain drop-shadow-sm group-hover:scale-[1.02] transition"
				/>
			</a>

			<nav class="hidden md:flex items-center gap-8 lg:gap-10 text-sm md:text-base font-medium tracking-wide">
				<a class="nav-link text-white/80 hover:text-white transition relative" href="/" data-page="home">Home</a>
				<a class="nav-link text-white/80 hover:text-white transition relative" href="/about" data-page="about">About</a>
				<a class="nav-link text-white/80 hover:text-white transition relative" href="/program" data-page="program">Programs</a>
				<a class="nav-link text-white/80 hover:text-white transition relative" href="/contact" data-page="contact">Contact</a>
				<a class="nav-link text-white/80 hover:text-white transition relative" href="/workshop" data-page="workshop">Workshop</a>
				<a class="nav-link text-white/80 hover:text-white transition relative" href="/blog" data-page="blog">Blog</a>
			</nav>

			<button
				id="menu-toggle"
				class="md:hidden w-10 h-10 flex flex-col items-center justify-center gap-1.5"
				aria-label="Open navigation menu"
			>
				<span class="sr-only">Toggle menu</span>
				<span class="w-6 h-0.5 bg-white rounded block"></span>
				<span class="w-6 h-0.5 bg-white rounded block"></span>
				<span class="w-6 h-0.5 bg-white rounded block"></span>
			</button>
		</div>

		<div
			id="mobile-menu"
			class="mobile-menu fixed inset-0 z-40 bg-gradient-to-r from-white/5 to-[#191919] backdrop-blur-lg flex flex-col items-center justify-center opacity-0 pointer-events-none translate-x-full min-h-[100svh] overflow-y-auto pt-32 pb-10"
			aria-hidden="true"
		>
			<button
				id="menu-close"
				class="absolute top-6 right-6 w-10 h-10 flex items-center justify-center z-50"
				aria-label="Close navigation menu"
			>
				<span class="sr-only">Close menu</span>
				<span class="absolute block w-8 h-0.5 bg-white rounded-full rotate-45"></span>
				<span class="absolute block w-8 h-0.5 bg-white rounded-full -rotate-45"></span>
			</button>

			<nav class="flex flex-col items-center text-xl font-semibold space-y-6">
				<a class="nav-link text-white/90 hover:text-white transition" href="/" data-page="home">Home</a>
				<a class="nav-link text-white/90 hover:text-white transition" href="/about" data-page="about">About</a>
				<a class="nav-link text-white/90 hover:text-white transition" href="/program" data-page="program">Programs</a>
				<a class="nav-link text-white/90 hover:text-white transition" href="/contact" data-page="contact">Contact</a>
				<a class="nav-link text-white/90 hover:text-white transition" href="/workshop" data-page="workshop">Workshop</a>
				<a class="nav-link text-white/90 hover:text-white transition" href="/blog" data-page="blog">Blog</a>
			</nav>
		</div>
	</header>

	<script>
		const header = document.getElementById('site-header');
		const menuToggle = document.getElementById('menu-toggle');
		const menuClose = document.getElementById('menu-close');
		const mobileMenu = document.getElementById('mobile-menu');
		const navLinks = document.querySelectorAll('.nav-link');

		// Function to detect current page and set active link
		const setActivePageLink = () => {
			const currentPath = window.location.pathname;
			const pathParts = currentPath.split('/').filter(p => p); // Remove empty parts
			const currentPage = pathParts[0] || 'home'; // Get first part or default to home
			
			navLinks.forEach((link) => {
				const linkPage = link.getAttribute('data-page');
				let isActive = false;
				
				// Check if link's page matches current page
				if (linkPage === currentPage) {
					isActive = true;
				}
				// Special case: home page (root or index)
				else if (linkPage === 'home' && (currentPath === '/' || currentPath === '' || pathParts.length === 0)) {
					isActive = true;
				}
				
				// Apply or remove active class
				if (isActive) {
					link.classList.add('active');
					link.classList.remove('text-white/80', 'text-white/90');
					link.classList.add('text-white');
					link.style.fontWeight = '700';
					link.style.color = '#FFBE49';
				} else {
					link.classList.remove('active');
					link.classList.add('text-white/80', 'text-white/90');
					link.style.fontWeight = 'normal';
					link.style.color = '';
				}
			});
		};

		const openMenu = () => {
			mobileMenu.classList.remove('pointer-events-none', 'translate-x-full', 'opacity-0');
			mobileMenu.classList.add('opacity-100', 'translate-x-0');
			document.body.classList.add('overflow-hidden');
			mobileMenu.setAttribute('aria-hidden', 'false');
		};

		const closeMenu = () => {
			mobileMenu.classList.add('pointer-events-none', 'translate-x-full', 'opacity-0');
			mobileMenu.classList.remove('opacity-100', 'translate-x-0');
			document.body.classList.remove('overflow-hidden');
			mobileMenu.setAttribute('aria-hidden', 'true');
		};

		menuToggle?.addEventListener('click', openMenu);
		menuClose?.addEventListener('click', closeMenu);

		mobileMenu?.addEventListener('click', (event) => {
			if (event.target === mobileMenu) {
				closeMenu();
			}
		});

		// Close mobile menu when a link is clicked
		navLinks.forEach((link) => {
			link.addEventListener('click', (event) => {
				// Close mobile menu after a short delay
				setTimeout(() => {
					closeMenu();
				}, 100);
			});
		});

		const handleScrollEffects = () => {
			const scrolled = window.scrollY > 50;
			header.classList.toggle('shadow-lg', scrolled);
			header.classList.toggle('bg-opacity-95', scrolled);
		};

		const logo = document.querySelector('a[href="/"]');
		logo?.addEventListener('click', (event) => {
			closeMenu();
		});

		document.addEventListener('scroll', handleScrollEffects);
		window.addEventListener('load', () => {
			setActivePageLink();
		});
		
		// Initialize active link on page load
		setActivePageLink();
		
		// Also check when page becomes visible
		document.addEventListener('visibilitychange', () => {
			if (!document.hidden) {
				setActivePageLink();
			}
		});
	</script>
</body>
</html>
